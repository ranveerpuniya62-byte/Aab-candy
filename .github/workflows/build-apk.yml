name: Build Candy Smash APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project around candy-smash.dat
        run: |
          set -e
          test -f candy-smash.dat || { echo "candy-smash.dat repo ke root me upload karo"; exit 1; }
          P=android-app
          mkdir -p $P/app/src/main/assets $P/app/src/main/java/com/techarena/candysmash
          cp candy-smash.dat $P/app/src/main/assets/candy-smash.html

          cat > $P/settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "CandySmash"
          include ':app'
          EOT

          cat > $P/build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOT

          cat > $P/gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          EOT

          cat > $P/app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.techarena.candysmash'
            compileSdk 34
            defaultConfig {
              applicationId 'com.techarena.candysmash'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            androidResources { noCompress 'html' }
          }
          EOT

          cat > $P/app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:label="Candy Smash"
              android:hardwareAccelerated="true"
              android:allowBackup="true"
              android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOT

          cat > $P/app/src/main/java/com/techarena/candysmash/MainActivity.java <<'EOT'
          package com.techarena.candysmash;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView web;

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              if (Build.VERSION.SDK_INT >= 28) {
                getWindow().getAttributes().layoutInDisplayCutoutMode =
                  WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              }
              web = new WebView(this);
              web.setBackgroundColor(Color.parseColor("#050b1e"));
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setUserAgentString(s.getUserAgentString() + " CandySmashApp");
              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient());
              web.loadUrl("file:///android_asset/candy-smash.html");
              immersive();
            }

            private void immersive() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
            }

            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) immersive(); }
            @Override protected void onPause() { super.onPause(); web.onPause(); }
            @Override protected void onResume() { super.onResume(); web.onResume(); }
            @Override public void onBackPressed() { moveTaskToBack(true); }
          }
          EOT

      - name: Build debug APK
        run: gradle -p android-app assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CandySmash-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
